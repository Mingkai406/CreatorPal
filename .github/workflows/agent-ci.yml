name: Agent CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: uv sync --locked --extra adk --extra dev
      - run: uv run --frozen ruff check creatorpal_agent tests_agent
      - run: uv run --frozen ruff format --check creatorpal_agent tests_agent
      - run: uv run --frozen pytest -q tests_agent
      - run: uv run --frozen python -m build
      - name: Verify wheel resources outside checkout
        run: |
          uv venv /tmp/creatorpal-wheel
          uv pip install --python /tmp/creatorpal-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/creatorpal-wheel/bin/creatorpal-agent compare --output /tmp/wheel-report
      - run: uv run --frozen creatorpal-agent compare --adapter offline-adk --output runs
      - run: docker build -f Dockerfile.analytics -t creatorpal-analytics .
      - name: Check restricted container execution
        run: CREATORPAL_DOCKER_TEST=1 uv run --frozen pytest -q tests_agent/test_research.py -k docker
      - uses: actions/upload-artifact@v4
        with:
          name: offline-agent-evaluation
          path: runs/
